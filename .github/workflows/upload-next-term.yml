name: Refresh current or upload next UMD term

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      term_id:
        description: 'Optional YYYY01 or YYYY08 term to refresh. Leave blank to detect the next term or refresh the latest term.'
        required: false
        type: string

concurrency:
  group: umd-term-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_LINK: ${{ secrets.QDRANT_LINK }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore embedding-model cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: fastembed-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            fastembed-${{ runner.os }}-

      - name: Install scraper dependencies
        run: pip install -r requirements.txt

      - name: Select target term
        id: term
        shell: bash
        run: |
          if [[ -n "${{ inputs.term_id }}" ]]; then
            latest_term="${{ inputs.term_id }}"
            next_term="${{ inputs.term_id }}"
            echo "manual=true" >> "$GITHUB_OUTPUT"
          else
            latest_term="$(python scripts/next_term.py --latest)"
            next_term="$(python scripts/next_term.py)"
            echo "manual=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest_term=$latest_term" >> "$GITHUB_OUTPUT"
          echo "next_term=$next_term" >> "$GITHUB_OUTPUT"

      - name: Choose new or current term to refresh
        id: availability
        shell: bash
        run: |
          if [[ "${{ steps.term.outputs.manual }}" == "true" ]]; then
            echo "target_term=${{ steps.term.outputs.latest_term }}" >> "$GITHUB_OUTPUT"
            echo "mode=manual refresh" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          python scripts/check_term.py "${{ steps.term.outputs.next_term }}"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "target_term=${{ steps.term.outputs.next_term }}" >> "$GITHUB_OUTPUT"
            echo "mode=newly published term" >> "$GITHUB_OUTPUT"
          elif [[ $status -eq 10 ]]; then
            echo "target_term=${{ steps.term.outputs.latest_term }}" >> "$GITHUB_OUTPUT"
            echo "mode=latest-term refresh" >> "$GITHUB_OUTPUT"
          else
            exit $status
          fi

      - name: Scrape and refresh selected term
        run: python scripts/scrape_and_upload.py "${{ steps.availability.outputs.target_term }}"

      - name: Workflow summary
        shell: bash
        run: |
          echo "Refreshed ${{ steps.availability.outputs.target_term }} (${{ steps.availability.outputs.mode }})." >> "$GITHUB_STEP_SUMMARY"
